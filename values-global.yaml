---
global:
  pattern: multicloud-gitops
  singleArgoCD: true
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic
main:
  patternsOperator:
    enableSubscription: false  
  clusterGroupName: hub
  gitops:
    customArgoYaml: |
      controller:
        resources:
          limits:
            cpu: "4"
            memory: "17Gi"  
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
